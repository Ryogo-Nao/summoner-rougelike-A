<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#f7f0e3" />
    <meta name="apple-mobile-web-app-title" content="召喚士" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <title>召喚士ローグライク</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="status">
        <div class="status-row">
          <span id="floor">B1F</span>
          <span id="effects"></span>
          <span id="runes" class="runes"></span>
          <span id="turn">0T</span>
        </div>
        <!-- 主人公の顔とレベル、その横にHP・MP・満腹 -->
        <div class="hero">
          <div class="face hero-face"><img src="art/face_player.png" alt="" draggable="false" /><span id="level" class="lv">Lv1</span></div>
          <div class="hero-bars">
            <div class="gauge-row"><span class="label">HP</span><div class="gauge hp"><i></i></div><span class="value" id="hp-text"></span></div>
            <div class="gauge-row"><span class="label">MP</span><div class="gauge mp"><i></i></div><span class="value" id="mp-text"></span></div>
            <div class="gauge-row"><span class="label">満腹</span><div class="gauge food"><i></i></div><span class="value" id="food-text"></span></div>
          </div>
        </div>
      </header>

      <main id="field">
        <!-- マップの上に余った高さの中央に、仲間の枠を置く -->
        <div id="allies-area">
          <section id="allies">
            <button class="ally-slot" data-slot="0"></button>
            <button class="ally-slot" data-slot="1"></button>
            <button class="ally-slot" data-slot="2"></button>
          </section>
        </div>
        <canvas id="map"></canvas>
      </main>

      <section id="log"></section>

      <footer id="controls">
        <div id="pad">
          <button data-dir="7">↖</button><button data-dir="0">↑</button><button data-dir="1">↗</button>
          <button data-dir="6">←</button><button data-dir="wait" class="center">●</button><button data-dir="2">→</button>
          <button data-dir="5">↙</button><button data-dir="4">↓</button><button data-dir="3">↘</button>
        </div>
        <div id="buttons">
          <button id="btn-attack" class="wide">攻撃</button>
          <button id="btn-magic">魔法</button>
          <button id="btn-card">仲間</button>
          <button id="btn-bag">バッグ</button>
          <button id="btn-menu">メニュー</button>
        </div>
      </footer>
      <!-- ログをタップすると開く、これまでのログ -->
      <div id="log-history" hidden>
        <div class="sheet-box">
          <div class="sheet-head">
            <span>ログ</span>
            <button id="log-close">閉じる</button>
          </div>
          <div id="log-history-list"></div>
        </div>
      </div>
      <!-- カード・魔法などの一覧。指の届く下側に出す -->
      <div id="sheet" hidden>
        <div class="sheet-box">
          <div class="sheet-head">
            <span id="sheet-title"></span>
            <button id="sheet-close">閉じる</button>
          </div>
          <div id="sheet-body"></div>
        </div>
      </div>
      <!-- 拠点。ダンジョンに入る前と、戻ってきたあとに開く -->
      <div id="base" hidden>
        <!-- 下のタブで、拠点のトップ・冒険・仲間・配合・商店・その他を行き来する -->
        <header class="base-head">
          <span id="base-title"></span>
          <span id="base-runes" class="runes"></span>
        </header>
        <nav id="base-tabs">
          <button data-tab="cards">仲間</button>
          <button data-tab="items">持ち物</button>
        </nav>
        <div id="base-body"></div>
        <button id="base-depart"></button>
        <nav id="base-nav"></nav>
      </div>
      <!-- 階に入ったときに、ダンジョンの名前と階を出す -->
      <div id="floor-title" hidden>
        <p id="floor-title-name"></p>
        <p id="floor-title-floor"></p>
      </div>
      <div id="dialog" hidden>
        <div class="dialog-box">
          <p id="dialog-text"></p>
          <div class="dialog-buttons">
            <button id="dialog-yes"></button>
            <button id="dialog-no"></button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
